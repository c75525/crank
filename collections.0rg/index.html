<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Instagram Gallery</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Major+Mono+Display&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header" aria-label="Site navigation">
    <a href="https://www.instagram.com/collections.0rg" target="_blank" rel="noreferrer" aria-label="Instagram Gallery on Instagram">instagram gallery</a>
    <a href="https://open.spotify.com/playlist/3rSYcczfMBETrgSjiRGpv5?si=B4Riwno-SyejY2J2lcYqoQ&pi=u-q8C-40VNT52x&utm_source=ig&utm_medium=social&utm_content=link_in_bio&fbclid=PAcGRvZgJleHRuA2FlbQIxMQBzcnRjBmFwcF9pZA85MzY2MTk3NDMzOTI0NTkAAacRJaZEY9gISKrzwAEi-g3vSNylYHYfd0C9cSPJvuEcQOuUqWn2TEs35ug1_w_aem_2kVMUbmYWMKu462JRHGKoQ&nd=1&dlsi=c49b7628db114d79" target="_blank" rel="noreferrer">playlist</a>
  </header>
  <main id="posts" aria-live="polite"></main>
  <template id="post-template">
    <article class="post">
      <div class="post-row" role="list"></div>
      <p class="post-caption"></p>
      <time class="post-date"></time>
    </article>
  </template>
  <template id="media-template">
    <a class="media-item" role="listitem" target="_blank" rel="noreferrer">
      <span class="media-frame"><img loading="lazy" decoding="async"></span>
      <span class="media-description"></span>
    </a>
  </template>
  <script type="module" src="app.js"></script>
</body>
</html>
