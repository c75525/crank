        scene.innerHTML = markup;
        const svg = scene.querySelector('svg');
        const handle = svg.querySelector('#dynamic_crank_handle');
        const crank = svg.querySelector('#static_crank');
        const layers = ['z1', 'z2', 'z3'].map(id => svg.querySelector(`#${id}`));
        handle.setAttribute('id', 'interactive_crank_handle');
        const pivotBox = crank.getBBox();
        crankPivot = { x: pivotBox.x + pivotBox.width / 2, y: pivotBox.y + pivotBox.height / 2 };

        // Keep both central bearing stacks stationary. Animate only the arm and grip.
        const armSlices = [...handle.children[0].children[1].children];
        const grip = handle.children[1];
        const armPivots = armSlices.map(polygon => {
          const points = polygon.points;
          return { x: (points[2].x + points[3].x) / 2,
                   y: (points[2].y + points[3].y) / 2 };
        });
        const bearing = armPivots[0];
        const gripBox = grip.children[0].getBBox();
        const gripBase = { x: gripBox.x + gripBox.width / 2,
                           y: gripBox.y + gripBox.height / 2 };

        // Preserve each layer's native centre for its independent, continuous RPM spin.
        const layerCenters = Object.fromEntries(layers.map(layer => {
          const box = layer.getBBox();
          return [layer.id, { x: box.x + box.width / 2, y: box.y + box.height / 2 }];
        }));
        crank.setAttribute('aria-label', 'Crank pivot');
        handle.setAttribute('role', 'slider');
        handle.setAttribute('aria-label', 'Drag crank handle to rotate parallax layers');
        handle.setAttribute('tabindex', '0');

        function setTransforms(now) {
          const elapsedMinutes = (now - startedAt) / 60000;
          layers.forEach(layer => {
            const center = layerCenters[layer.id];
            const spin = rpm[layer.id] * 360 * elapsedMinutes;
            const orbit = dragOffset * dragRatio[layer.id];
            const radius = parallaxRadius[layer.id];
            const x = core.x + Math.cos(orbit * Math.PI / 180) * radius;
            const y = core.y + Math.sin(orbit * Math.PI / 180) * radius;
            // Spin at the requested RPM around the layer's own centre, then orbit that centre around the core.
            layer.setAttribute('transform', `translate(${x - center.x} ${y - center.y}) rotate(${spin} ${center.x} ${center.y})`);
          });
          renderCrank(dragOffset);
          // Fixed bearing, rotating arm, and a grip with camera-aligned depth.
          requestAnimationFrame(setTransforms);
        }

        function renderCrank(angle) {
          // Each arm slice keeps its original axial offset, so thickness does not
          // rotate with the camera. The two bearing groups have no transforms.
          armSlices.forEach((polygon, index) => {
            const pivot = armPivots[index];
            polygon.setAttribute('transform', `rotate(${angle} ${pivot.x} ${pivot.y})`);
          });
          const radians = angle * Math.PI / 180;
          const c = Math.cos(radians), s = Math.sin(radians);
          const dx = gripBase.x - bearing.x, dy = gripBase.y - bearing.y;
          grip.setAttribute('transform', `translate(${c * dx - s * dy - dx} ${s * dx + c * dy - dy})`);
        }

        function pointerAngle(event) {
          const point = svg.createSVGPoint();
          point.x = event.clientX;
          point.y = event.clientY;
          // The replacement crank has its own translated coordinate system.
          const localPoint = point.matrixTransform(handle.getScreenCTM().inverse());
          return Math.atan2(localPoint.y - bearing.y, localPoint.x - bearing.x) * 180 / Math.PI;
        }

        function beginDrag(event) {
          isDragging = true;
          lastPointerAngle = pointerAngle(event);
          handle.classList.add('dragging');
          handle.setPointerCapture(event.pointerId);
          event.preventDefault();
        }
        function moveDrag(event) {
          if (!isDragging) return;
          const current = pointerAngle(event);
          let delta = current - lastPointerAngle;
          if (delta > 180) delta -= 360;
          if (delta < -180) delta += 360;
          dragOffset += delta;
          lastPointerAngle = current;
        }
        function endDrag(event) {
          if (!isDragging) return;
          isDragging = false;
          handle.classList.remove('dragging');
          if (handle.hasPointerCapture(event.pointerId)) handle.releasePointerCapture(event.pointerId);
        }

        handle.addEventListener('pointerdown', beginDrag);
        handle.addEventListener('pointermove', moveDrag);
        handle.addEventListener('pointerup', endDrag);
        handle.addEventListener('pointercancel', endDrag);
        handle.addEventListener('keydown', event => {
          if (event.key === 'ArrowRight' || event.key === 'ArrowUp') { dragOffset += 10; event.preventDefault(); }
          if (event.key === 'ArrowLeft' || event.key === 'ArrowDown') { dragOffset -= 10; event.preventDefault(); }
        });
        requestAnimationFrame(setTransforms);
    }
  </script>
