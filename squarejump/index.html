<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Square Jump</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="scroll-stage" aria-label="Scroll to animate the square menu">
    <div id="sticky-scene">
      <svg id="menu" viewBox="0 0 1920 1080" role="img" aria-label="Animated square menu">
        <rect class="background" width="1920" height="1080" fill="#d32a00" />
        <g id="menu-squares"></g>
      </svg>
    </div>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
